<html>
    <head>
        <title>Book Store</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <main>
            <h1>My Books</h1>
                
                <div class="thumbnail-grid">
                    {% for book in books %}
                    <div class= "book-thumbnail">

                        <img src = "{{ book.image_url if book.image_url else 'https://via.placeholder.com/300x200' }}" alt = "{{ book.title }}">
                        
                        <div class="caption">
                            <h3> {{book.title }} </h3>
                            <p> By {{ book.author }}</p>
                        </div>
                    </div>
                    {% endfor %}
            </div>
        </main>
    </body>
</html>
